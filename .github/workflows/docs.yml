name: docs

# Déclenche la (re)construction de la documentation dans xolo-gateway/docs :
#   - push sur main   -> repository_dispatch "xolo-main"    -> publication ./main/
#   - tag sémantique  -> repository_dispatch "xolo-release" -> publication ./<version>/
#
# Nécessite le secret DOCS_DISPATCH_TOKEN : un PAT fine-grained (ou un token de
# GitHub App) disposant de la permission "Contents: read & write" sur le dépôt
# xolo-gateway/docs. Le GITHUB_TOKEN par défaut ne peut pas déclencher un
# workflow dans un autre dépôt.

on:
  push:
    branches: ["main"]
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou branche de xolo à publier"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: docs-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Determine dispatch payload
        id: payload
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_REF: ${{ inputs.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ref="${MANUAL_REF:-${REF_NAME}}"
          ref_type="${REF_TYPE}"

          if [[ -n "${MANUAL_REF:-}" && "${MANUAL_REF}" != "main" ]]; then
            ref_type="tag"
          fi

          if [[ "${ref_type}" == "tag" ]]; then
            # Seuls les tags sémantiques publient une version. Les tags internes
            # (ex. v2026.3.11-main.2338.b7f62f8) sont ignorés.
            if [[ ! "${ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag non sémantique, publication ignorée: ${ref}"
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            event_type="xolo-release"
          else
            event_type="xolo-main"
          fi

          {
            echo "skip=false"
            echo "event_type=${event_type}"
            echo "ref=${ref}"
            echo "sha=${SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Trigger documentation build
        if: steps.payload.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          EVENT_TYPE: ${{ steps.payload.outputs.event_type }}
          REF: ${{ steps.payload.outputs.ref }}
          SHA: ${{ steps.payload.outputs.sha }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/xolo-gateway/docs/dispatches \
            -f "event_type=${EVENT_TYPE}" \
            -f "client_payload[ref]=${REF}" \
            -f "client_payload[sha]=${SHA}"

          echo "Dispatch ${EVENT_TYPE} envoyé pour ${REF} (${SHA})"
